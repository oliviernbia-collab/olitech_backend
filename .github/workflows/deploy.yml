name: Deploy backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Prepare restart trigger file
        run: touch restart_trigger

      # Identifiants via ~/.netrc plutot que -u user,pass : un mot de passe
      # contenant une virgule ou un caractere special casserait sinon la
      # syntaxe de lftp avant meme la tentative de connexion.
      - name: Write netrc credentials
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.SSH_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          cat > ~/.netrc <<NETRC
          machine $FTP_HOST
          login $FTP_USER
          password $FTP_PASSWORD
          NETRC
          chmod 600 ~/.netrc

      # olitechbackend est un dossier dedie a cette app (hors public_html), donc
      # --delete y est sans risque pour les autres sites. .env, uploads/ et
      # private/ restent proteges (donnees serveur / utilisateurs, jamais dans le
      # depot). node_modules est synchronise a part (construit ici sur Linux x64,
      # meme architecture que le serveur) pour eviter de le reconstruire via npm
      # sur l'hebergeur, qui n'est accessible que par FTP.
      - name: Deploy over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          set +e
          lftp "$FTP_HOST" -e "
            debug 3 -o lftp_debug.log;
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set ftp:ssl-allow true;
            set ftp:ssl-force true;
            cd olitechbackend;
            mirror --reverse --delete --verbose --exclude-glob .git/ --exclude-glob .github/ --exclude-glob node_modules/ --exclude-glob .env --exclude-glob uploads/ --exclude-glob private/ --exclude-glob tmp/ ./ ./;
            mirror --reverse --delete --verbose node_modules/ node_modules/;
            mkdir -p tmp;
            put restart_trigger -o tmp/restart.txt;
            bye;
          " > lftp_output.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            cat lftp_output.log lftp_debug.log > combined.log 2>/dev/null
            ESCAPED=$(tail -c 3000 combined.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::lftp exited $code: $ESCAPED"
            exit $code
          fi

      - name: Clean up netrc
        if: always()
        run: rm -f ~/.netrc
